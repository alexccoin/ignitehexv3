# IgniteHeX v3 — static SPA deploy.
#
# WHY NETLIFY AND NOT SOMETHING ELSE: everything that decides what gets
# deployed lives in this file, so a reviewer sees the whole deploy in the diff.
# Vercel and Cloudflare Pages can both serve this app perfectly well, but on
# both of them the build command and output directory live in project settings
# by default, which means the repository stops being the record of how the site
# is built. The one thing that is deliberately NOT here is the two environment
# variables — see docs/DEPLOYMENT.md.
#
# If you would rather not depend on a host at all, the Dockerfile in this repo
# serves the identical build behind nginx with the identical fallback rule.

[build]
  command  = "npm ci && npm run build"
  publish  = "dist"

[build.environment]
  NODE_VERSION = "22"
  # VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY are NOT set here.
  # Vite inlines VITE_* variables into the bundle at BUILD time, so they must be
  # present in this build environment — set them per-context in the Netlify UI
  # or with `netlify env:set`. Putting them in this file would commit the
  # backend a build points at, and would make production and preview builds
  # indistinguishable in the repository.

# ---------------------------------------------------------------- SPA routing
#
# React Router owns every path below /. Without this, /wallet, /staking,
# /admin/exposure and the other ~50 client routes return 404 on a cold load or
# a refresh: they are real URLs to the router and nonexistent files to the CDN.
#
# status = 200 (a rewrite, not a redirect) so the URL the user typed is the URL
# they keep and the router can read it. This rule is last, so any real file in
# dist/ still wins.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ---------------------------------------------------------------- caching
#
# Vite fingerprints everything under /assets, so those are safe to pin. The
# shell must never be pinned: a stale index.html points at asset hashes that no
# longer exist and the app fails to boot with nothing useful in the console.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------- headers
#
# NOT a Content-Security-Policy. A useful CSP for this app needs `connect-src`
# to name the Supabase origin, which is per-environment and only known at build
# time, so a static value here would either be wrong or so wide as to be
# decorative. Generating one from VITE_SUPABASE_URL at build is the right fix
# and is listed as outstanding in docs/DEPLOYMENT.md rather than faked here.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options   = "nosniff"
    X-Frame-Options          = "DENY"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "camera=(), microphone=(), geolocation=(), payment=()"
