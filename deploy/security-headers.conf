# Included by every location in nginx.conf that sets a header of its own.
#
# This file exists because of an nginx rule that is easy to get wrong: a level
# inherits `add_header` from its parent ONLY IF it declares no `add_header` of
# its own. Setting Cache-Control inside `location = /index.html` therefore
# silently dropped every security header from the page that matters most — the
# shell, which is what the SPA fallback serves for all ~50 client routes.
#
# The failure is invisible: the page still loads, the status is still 200, and
# only a header dump shows anything wrong.
#
# NOT a Content-Security-Policy. A useful `connect-src` names the Supabase
# origin, which differs per environment and is only known at build time, so a
# value hardcoded here would either be wrong or so wide as to be decorative.
# See docs/DEPLOYMENT.md.

add_header X-Content-Type-Options "nosniff"                              always;
add_header X-Frame-Options        "DENY"                                 always;
add_header Referrer-Policy        "strict-origin-when-cross-origin"      always;
add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=()" always;
