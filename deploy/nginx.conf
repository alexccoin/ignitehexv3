# Static SPA. Kept deliberately close to netlify.toml so the two hosts behave
# the same: same fallback, same cache split, same headers, no CSP.
#
# security-headers.conf is included in EVERY location rather than set once at
# server level. See the comment in that file — nginx drops inherited
# `add_header` from any level that sets one of its own, and getting this wrong
# strips the headers from the shell without changing a single status code.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # nginx's own temp dirs, so the container can run as a non-root user.
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Liveness. Answered by nginx itself so it stays true even if the bundle is
    # missing — this says "the server is up", never "the app works".
    location = /healthz {
        access_log off;
        include /etc/nginx/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted by Vite, so safe to pin forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The shell must never be pinned: a stale index.html references asset hashes
    # that no longer exist, and the app fails to boot with nothing useful in the
    # console. This block is also where the SPA fallback lands, so it serves
    # every client route.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # SPA fallback. React Router owns ~50 paths below / that are real URLs to
    # the router and nonexistent files to nginx; without this they 404 on a cold
    # load or a refresh. A real file always wins, so this cannot mask a missing
    # asset — those still 404 through the /assets/ block above.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
